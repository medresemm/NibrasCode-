name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '21' }
    - uses: actions/setup-node@v4
      with: { node-version: '22' }
    - run: npm install && npm run build || true
    - run: npx cap sync android
    - name: Yeni Keystore Yarat (Dogru Alias Ile)
      run: |
        cd android/app
        rm -f nibras-upload-key.jks
        keytool -genkey -v -keystore nibras-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "nibras-upload" -storepass "nibras123" -keypass "nibras123" -dname "CN=Nibras, OU=App, O=Nibras, L=Baku, S=Baku, C=AZ"
    - name: Release APK Olustur
      env:
        ANDROID_UPLOAD_KEYSTORE_PASSWORD: "nibras123"
        ANDROID_UPLOAD_KEY_PASSWORD: "nibras123"
      run: cd android && chmod +x gradlew && ./gradlew assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
